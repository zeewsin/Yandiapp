name: Android CI/CD

on:
  push:
    branches: [ "utama" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: YandiApp-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

android {
    namespace = "com.yandiapp"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.yandiapp"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
    }

    buildFeatures {
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.1"
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
    implementation("androidx.activity:activity-compose:1.8.2")
    implementation(platform("androidx.compose:compose-bom:2024.02.00"))
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.bluetooth:bluetooth:1.0.0-alpha02")
}
package com.yandiapp

import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.layout.*
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.unit.dp

class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent {
            // Gunakan MaterialTheme jika file YandiAppTheme belum ada
            MaterialTheme { 
                Surface(modifier = Modifier.fillMaxSize()) {
                    YandiHomeScreen()
                }
            }
        }
    }
}

@Composable
fun YandiHomeScreen() {
    var steps by remember { mutableStateOf(8523) }
    var heartRate by remember { mutableStateOf(78) }
    var calories by remember { mutableStateOf(245) }

    Column(
        modifier = Modifier.fillMaxSize().padding(16.dp),
        horizontalAlignment = Alignment.CenterHorizontally,
        verticalArrangement = Arrangement.spacedBy(24.dp)
    ) {
        Text("Yandi App", style = MaterialTheme.typography.headlineLarge)
        
        Card(modifier = Modifier.fillMaxWidth()) {
            Column(modifier = Modifier.padding(16.dp)) {
                Text("Langkah: $steps", style = MaterialTheme.typography.headlineMedium)
                Text("Detak Jantung: $heartRate bpm")
                Text("Kalori: $calories kcal")
            }
        }
        
        Button(onClick = { /* Sync */ }) { Text("Sync Device") }
        
        Button(onClick = { 
            steps += 100
            heartRate = (70..90).random()
            calories += 10 
        }) {
            Text("Update Data")
        }
    }
}
<uses-permission android:name="android.permission.BLUETOOTH" />
<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
<uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
<uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
